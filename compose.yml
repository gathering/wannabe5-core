services:
  # Mainly used via .devcontainer/devcontainer.json, feel free to disable if needed
  devcontainer:
    build:
      dockerfile: ./.devcontainer/Dockerfile
    ports:
      # Should ideally match those listed in devcontainer.json
      - 8000:8000
    volumes:
      # Matches `workspaceFolder` setting in devcontainer.json
      - .:/workspace:cached
    # Bind 0.0.0.0 so host port mapping can reach artisan serve.
    command: ./scripts/initialise-dev-container.sh php artisan serve --host=0.0.0.0 --port=8000
    depends_on:
      - db
    env_file: .env
    networks:
      - default
      # Reach Keycloak via docker network alias keycloak.wannabe5.gathering.org
      - wannabe
    extra_hosts:
      - "keycloak.wannabe5.gathering.org:host-gateway"
      - "wannabe5.gathering.org:host-gateway"

  db:
    # Pin major version: postgres:latest is 18+, which rejects the legacy
    # /var/lib/postgresql/data mount used by existing local volumes and CI.
    image: postgres:17
    ports:
      - 127.0.0.1:5432:5432
    env_file: .env
    volumes:
      - wannabe5_core_pgdata:/var/lib/postgresql/data
      - ./scripts/create-test-db.sh:/docker-entrypoint-initdb.d/create-test-db.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s
    networks:
      - default

networks:
  wannabe:
    name: wannabe
    external: true

volumes:
  wannabe5_core_pgdata:
