name: CI
permissions:
  contents: read
on:
  workflow_dispatch:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      - name: Run composer install
        run: composer install -n --prefer-dist
      - name: Run Pint in test mode
        run: composer run-script test:lint

  static-analysis:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      - name: Run composer install
        run: composer install -n --prefer-dist
      - name: Run PHPStan
        run: composer run-script test:static

  tests:
    runs-on: ubuntu-latest
    needs: static-analysis
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Setup database using docker
        run: |
          cp .env.ci.testing .env
          docker compose -f compose.yml up db -d
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, bcmath, soap, intl, gd, exif, iconv
          coverage: none
      - name: Run composer install
        run: composer install -n --prefer-dist
      - name: Prepare Laravel Application
        run: |
          php artisan key:generate
          php artisan migrate --force -n
      - name: Run tests
        run: php artisan test
      - name: Run compatibility contract tests
        run: composer run-script test:contracts
      - name: Check parity matrix coverage
        run: composer run-script check:parity
      - name: Check openapi.json file
        run: composer run-script check:openapi
